name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  validate-formulae:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tap local repository
        run: brew tap local/homebrew-quality "$GITHUB_WORKSPACE"

      - name: Style
        run: brew style local/homebrew-quality

      - name: Audit
        run: brew audit --strict --online --tap local/homebrew-quality

  verify-downloads:
    name: Verify downloads (${{ matrix.formula }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        formula: [axterminator, mcp-gateway, nab, nowifi, trvl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tap local repository
        run: brew tap local/homebrew-quality "$GITHUB_WORKSPACE"

      - name: Fetch release artifact
        run: HOMEBREW_NO_INSTALL_FROM_API=1 brew fetch --force --retry "local/homebrew-quality/${{ matrix.formula }}"
